name: Deploy Far Cry Lagoon to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir _site
          cp index.html golingo-bridge.js golingo-sponsor.js exploration-zones.js hunt-ux.js mobile-guard.js hunt-visibility.js hunt-reset.js tap-words.js _site/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("_site/index.html")
          s=p.read_text()
          tags=['<script src="golingo-bridge.js"></script>','<script src="golingo-sponsor.js"></script>','<script src="exploration-zones.js"></script>','<script src="hunt-ux.js"></script>','<script src="mobile-guard.js"></script>','<script src="hunt-visibility.js"></script>','<script src="hunt-reset.js"></script>','<script src="tap-words.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace("</body>",tag+"\n</body>")
          p.write_text(s)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
